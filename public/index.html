<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Free-Chat</title>
        <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1/dist/lenis.min.js"></script>
        <script src="/socket.io/socket.io.js"></script>
        <link rel="icon" href="resources/icon.png" />
        <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.17/dist/lenis.css" />
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <div id="app">
            <div id="lobby" class="container">
                <h1 class="title">FreeChat</h1>
                <div class="input-group">
                    <input type="text" id="username" placeholder="Digite seu nome" />
                </div>

                <div id="room-selection">
                    <div id="create-room-form">
                        <h2>Criar uma sala</h2>
                        <input type="text" id="room-name" placeholder="Nome da sala" />
                        <input type="password" id="room-password" placeholder="Senha (opcional)" />
                        <button id="create-room-btn">Criar e Entrar</button>
                    </div>
                    <div id="existing-rooms">
                        <h2>Salas existentes</h2>
                        <ul id="rooms-list"></ul>
                    </div>
                </div>
            </div>

            <div id="chat-container" class="container" style="display: none">
                <div id="chat-header">
                    <h2 id="chat-room-name"></h2>
                    <button id="leave-room-btn">Sair da Sala</button>
                </div>
                <div id="chat-body">
                    <div id="messages"></div>
                    <div id="typing-indicator"></div>
                </div>
                <div id="chat-input">
                    <input type="file" id="media-input" accept="image/*" style="display: none" />
                    <input type="text" id="message-input" placeholder="Digite uma mensagem..." />
                    <button id="send-media-btn">+</button>
                    <button id="send-message-btn">Enviar</button>
                </div>
            </div>
            <div class="container" id="participant-container" style="display: none">
                <div id="participants-container">
                    <h3>Participantes</h3>
                    <ul id="participants-list"></ul>
                </div>
            </div>

            <dialog id="request-media-dialog" class="container">
                <div>
                    <p id="requester-username"></p>
                    <div style="display: flex; gap: 0.7rem">
                        <button id="accept-resquest-media">Aceitar</button>
                        <button onclick="this.closest('dialog').close()">Recusar</button>
                    </div>
                </div>
            </dialog>
            <dialog id="options-dialog" class="container">
                <div class="dialog-header">
                    <h2>Anexar Mídia</h2>
                    <button class="close-btn" onclick="this.closest('dialog').close()">
                        &times;
                    </button>
                </div>
                <div class="dialog-body">
                    <div class="media-option drop-zone">
                        <button id="select-media-file-btn">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <polyline points="17 8 12 3 7 8" />
                                <line x1="12" x2="12" y1="3" y2="15" />
                            </svg>
                            <span>Selecionar do Computador</span>
                        </button>
                        <p>ou arraste e solte um arquivo aqui</p>
                    </div>
                    <div class="divider">ou</div>
                    <div class="media-option link-option">
                        <label for="media-link-input">Link de Imagem ou Vídeo</label>
                        <div class="input-with-button">
                            <input
                                id="media-link-input"
                                type="text"
                                placeholder="Cole o link aqui..."
                            />
                            <button id="send-link-btn">Enviar</button>
                        </div>
                        <p>Cole um link de imagem ou de um vídeo do YouTube.</p>
                    </div>
                </div>
            </dialog>
        </div>
        <script src="js/main.js" type="module"></script>

        <div id="image-modal" class="modal-overlay" style="display: none">
            <span class="modal-close">&times;</span>
            <img class="modal-content" id="modal-image" />
        </div>
    </body>
</html>
